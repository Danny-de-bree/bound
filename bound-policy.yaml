# BOUND policy configuration — auto-generated by ``bound init``.
# Review and adjust before use.

schema_version: "1.0"

policy:
  id: auto-generated
  version: "0.1.0"

# --- Collectors ---
collectors:
  test:
    type: command
    command: [python, -m, pytest]
    timeout_seconds: 120
    success_exit_codes: [0]

  lint:
    type: command
    command: [python, -m, ruff, check, .]
    timeout_seconds: 60
    success_exit_codes: [0]

  typecheck:
    type: command
    command: [python, -m, mypy, src]
    timeout_seconds: 120
    success_exit_codes: [0]

# --- Hard gates (blockers): can never be compensated by positive scores. ---
acceptance_checks:
  - id: tests-pass
    description: "All tests pass."
    importance: blocker
    required: true
    on_failure: retry
    on_missing: retry
    on_claimed: replan
    minimum_assurance: verified
    accepted_provenance: [verified, observed]
    collector: test

# --- Weighted signals (quality): soft contributions, never override a blocker. ---
quality_checks:
  - id: lint-clean
    description: "Lint is clean."
    importance: medium
    collector: lint

  - id: typecheck-clean
    description: "Type checking passes."
    # UNCERTAIN: mypy mentioned in pyproject.toml
    importance: medium
    collector: typecheck

  - id: coverage
    description: "Test coverage does not regress."
    importance: low

# --- Risk hard gates (blockers): violations are unacceptable. ---
risk_checks:
  - id: no-secrets
    description: "No plaintext secrets are introduced in the diff."
    importance: blocker
    required: true
    on_failure: rollback
    on_missing: replan
    on_claimed: rollback
    accepted_provenance: [verified, observed]

  - id: scope-respected
    description: "Only allowed paths were modified."
    importance: blocker
    required: true
    on_failure: replan
    on_missing: replan

# --- Budgets: soft/hard limits with configurable action at each limit. ---
budgets:
  attempts:
    soft_limit: 2
    hard_limit: 3
    on_soft: retry
    on_hard: replan
  tool_calls:
    soft_limit: 15
    hard_limit: 20
    on_soft: retry
    on_hard: replan
  tokens:
    hard_limit: 200000
    on_hard: replan
  runtime:
    soft_limit: 300
    hard_limit: 600
    on_soft: retry
    on_hard: replan
  financial_cost:
    enabled: false  # disabled by default; enable when cost telemetry exists

# --- Scope and safety. ---
change_scope:
  allowed_paths:
    - "src/**"
  forbidden_paths:
    - ".git/**"
    - "**/.env"
  dependency_file_patterns:
    - "pyproject.toml"
    - "uv.lock"
  unexpected_artifacts:
    enabled: true
    on_unexpected: replan
    allowed_patterns:
      - "*.md"

# --- Approvals and rollback. ---
approvals:
  commands_requiring_approval:
    - "rm"
    - "git push --force"
  destructive_actions:
    - "rm -rf"
    - "git push --force"
  require_rollback_availability: false
  on_missing_rollback: replan

# --- Resolve these before approving ---
# type_checker: UNCERTAIN: mypy (mypy mentioned in pyproject.toml)
# git branch: main
# git remote: https://github.com/Danny-de-bree/bound.git
